<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luis Sandoval &#xB7; Estudio en la Jungla</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1a0b2e;--ink:#fff8ee;--dim:#d9c7e8;--gold:#ffd400;--green:#1ed760;--red:#e0302f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  body.hover canvas{cursor:pointer}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#2b0f4a,#c2397a 70%,#ff9a3c);z-index:20;transition:opacity .6s}
  #loader .pct{font:64px "Archivo Black",sans-serif;text-align:center}
  #loader .bar{width:140px;height:3px;background:#0004;margin:10px auto}
  #loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fbf5b,#ffd400,#e0302f)}
  #loader .msg{font-size:11px;letter-spacing:.25em;color:#fff;text-align:center;text-transform:uppercase}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:13px;color:#fff;background:#0008;padding:8px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  .panel{position:fixed;background:#140a22f0;border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.25s;z-index:10}
  .panel.on{opacity:1;pointer-events:auto}
  .panel .x{position:absolute;top:8px;right:12px;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  #card{top:20px;left:20px;width:300px;padding:18px 18px 16px;transform:translateY(-8px)}
  #card.on{transform:none}
  #card .tag{font-size:10px;letter-spacing:.25em;color:var(--green);font-weight:700}
  #card h1{font:28px "Archivo Black",sans-serif;margin:6px 0 12px}
  #card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  #card dt{color:var(--dim)} #card dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:14px}
  .links a{display:block;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:12px;padding:9px 4px;border-radius:8px}
  .sp{background:#1db954}.am{background:linear-gradient(135deg,#fa233b,#fb5c74)}.yt{background:#e0302f}
  #player{right:20px;bottom:60px;width:min(380px,92vw);padding:34px 12px 12px}
  #player .t{position:absolute;top:10px;left:14px;font-size:11px;letter-spacing:.2em;font-weight:700;color:var(--dim)}
  #player iframe{width:100%;border:0;border-radius:12px;display:block}
  #video{inset:0;margin:auto;width:min(960px,94vw);height:fit-content;padding:40px 12px 12px;background:#000e}
  #video .frame{position:relative;width:100%;padding-top:56.25%}
  #video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
</style>
</head>
<body>
<div id="loader"><div><div class="pct" id="pct">0%</div><div class="bar"><i id="bar"></i></div><div class="msg" id="msg">Plantando palmeras</div></div></div>
<div id="hint">Arrastra para mirar &#xB7; toca los posters, la TV, a Luis, las ranas y al cocodrilo</div>

<div id="card" class="panel">
  <button class="x" aria-label="Cerrar">&#xD7;</button>
  <div class="tag">ARTISTA IDENTIFICADO</div>
  <h1>LUIS SANDOVAL</h1>
  <dl>
    <dt>G&#xE9;nero</dt><dd>Corridos Tropicales</dd>
    <dt>Suscriptores</dt><dd id="c-subs">&#x2014;</dd>
    <dt>Vistas totales</dt><dd id="c-views">&#x2014;</dd>
    <dt>Videos</dt><dd id="c-videos">&#x2014;</dd>
    <dt>Status</dt><dd>En la jungla &#x1F334;</dd>
  </dl>
  <div class="links">
    <a class="sp" href="https://open.spotify.com/artist/29CZrQcy62hjQLwfp1oZl0" target="_blank" rel="noopener">Spotify</a>
    <a class="am" href="https://music.apple.com/us/artist/luis-sandoval/947040880" target="_blank" rel="noopener">Apple Music</a>
    <a class="yt" href="https://www.youtube.com/@Luissandovallll" target="_blank" rel="noopener">YouTube</a>
  </div>
</div>

<div id="player" class="panel"><span class="t" id="player-t">AHORA SONANDO</span><button class="x" aria-label="Cerrar">&#xD7;</button><div id="player-slot"></div></div>
<div id="video" class="panel"><button class="x" aria-label="Cerrar">&#xD7;</button><div class="frame" id="video-slot"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
(() => {
const FALLBACK = { subs: 20400, views: 8609485, videos: 286 };
const MUSIC = {
  spotifyTrack: '5tC47NMTom57QuPXrMtpqD',   // #1 on Spotify: KONNICHIWA
  spotifyArt: 'https://i.scdn.co/image/ab67616d0000b273506ecea7fff91c4f3b52345e',
  appleEmbed: 'https://embed.music.apple.com/us/album/panam%C3%A1/6797576783?i=6797576791', // #2: Panama (w/ Axel Rodriguez)
  appleArt: 'https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/1c/57/aa/1c57aab3-c4fd-8a24-4d06-b7083d2a0ade/885288242478.jpg/600x600bb.jpg',
  youtubeId: 'V-500lsoBvs'                    // KONNICHIWA (Video Oficial)
};
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- loader ----------
const msgs=['Plantando palmeras','Despertando al cocodrilo','Afinando el requinto','Subiendo el volumen'];
let p=0; const pct=document.getElementById('pct'), bar=document.getElementById('bar'), msg=document.getElementById('msg');
const loadTick=setInterval(()=>{ p=Math.min(100,p+4+Math.random()*9); pct.textContent=Math.floor(p)+'%'; bar.style.width=p+'%'; msg.textContent=msgs[Math.min(3,Math.floor(p/26))];
  if(p>=100){ clearInterval(loadTick); setTimeout(()=>{ const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),600); },250); } },70);

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputEncoding=THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0xd8708a,26,70);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);

const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
function box(w,h,d,c,x,y,z,parent=scene,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),(c.isMaterial||Array.isArray(c))?c:mat(c,o)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m; }
function cyl(r1,r2,h,c,x,y,z,parent=scene,seg=20){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),c.isMaterial?c:mat(c)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m; }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x,c); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; t.userData={c,x,draw}; return t; }
function loadImg(src){ return new Promise(res=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }

// ---------- sunset sky ----------
const skyTex=canvasTex(16,512,(x)=>{ const g=x.createLinearGradient(0,0,0,512); g.addColorStop(0,'#2b0f4a'); g.addColorStop(.38,'#7a2a8c'); g.addColorStop(.56,'#e0457b'); g.addColorStop(.66,'#ff8a3d'); g.addColorStop(.72,'#ffc06a'); g.addColorStop(1,'#ffc06a'); x.fillStyle=g; x.fillRect(0,0,16,512); });
const sky=new THREE.Mesh(new THREE.SphereGeometry(120,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false})); scene.add(sky);
const sunTex=canvasTex(256,256,(x)=>{ const g=x.createRadialGradient(128,128,10,128,128,128); g.addColorStop(0,'#fff6c8'); g.addColorStop(.25,'#ffd36b'); g.addColorStop(.5,'#ff9a3c88'); g.addColorStop(1,'#ff9a3c00'); x.fillStyle=g; x.fillRect(0,0,256,256); });
const sun=new THREE.Sprite(new THREE.SpriteMaterial({map:sunTex,fog:false,depthWrite:false})); sun.scale.set(26,26,1); sun.position.set(-6,3.5,-95); scene.add(sun);

// ---------- ocean ----------
const oceanGeo=new THREE.PlaneGeometry(220,220,90,90);
const ocean=new THREE.Mesh(oceanGeo,new THREE.MeshStandardMaterial({color:0x2a5e9e,roughness:.18,metalness:.35,emissive:0x40154f,emissiveIntensity:.35}));
ocean.rotation.x=-Math.PI/2; ocean.position.y=-.12; scene.add(ocean);
const oceanBase=oceanGeo.attributes.position.array.slice();

// ---------- sand island ----------
const sandTex=canvasTex(1024,1024,(x)=>{ x.fillStyle='#e9c98f'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<26000;i++){ const l=62+Math.random()*22; x.fillStyle=`hsl(38,55%,${l}%)`; x.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  x.strokeStyle='#d4ac6b55'; x.lineWidth=3; for(let i=0;i<18;i++){ x.beginPath(); const y=Math.random()*1024; x.moveTo(0,y); for(let k=0;k<=1024;k+=32) x.lineTo(k,y+Math.sin(k*.02+i)*10); x.stroke(); } });
sandTex.wrapS=sandTex.wrapT=THREE.RepeatWrapping; sandTex.repeat.set(.12,.12);
const islandShape=new THREE.Shape(); for(let i=0;i<=64;i++){ const a=i/64*Math.PI*2; const r=1+.06*Math.sin(a*5)+.04*Math.cos(a*9); const px=Math.cos(a)*8.4*r, pz=Math.sin(a)*7.0*r; i?islandShape.lineTo(px,pz):islandShape.moveTo(px,pz); }
const island=new THREE.Mesh(new THREE.ExtrudeGeometry(islandShape,{depth:.4,bevelEnabled:true,bevelSize:.6,bevelThickness:.25,bevelSegments:4}),mat(0xffffff,{map:sandTex,roughness:.95}));
island.rotation.x=-Math.PI/2; island.position.y=-.65; island.receiveShadow=true; scene.add(island);
// foam ring at the shoreline
const foam=new THREE.Mesh(new THREE.RingGeometry(1,1.04,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.75}));
foam.rotation.x=-Math.PI/2; foam.scale.set(8.95,7.5,1); foam.position.y=-.05; scene.add(foam);

// ---------- palm trees ----------
const trunkM=mat(0x7a5634,{roughness:1}), trunkRing=mat(0x5e3f24,{roughness:1}), leafM=new THREE.MeshStandardMaterial({color:0x2f8f3f,roughness:.7,side:THREE.DoubleSide}), leafM2=new THREE.MeshStandardMaterial({color:0x3fae4d,roughness:.7,side:THREE.DoubleSide});
function frond(len,m){ const g=new THREE.PlaneGeometry(.55,len,1,10); g.translate(0,len/2,0); const a=g.attributes.position;
  for(let i=0;i<a.count;i++){ const y=a.getY(i), t=y/len; a.setX(i,a.getX(i)*Math.sin(Math.PI*Math.min(1,t*1.15+.05))); a.setZ(i,-t*t*len*.55); }
  g.computeVertexNormals(); const f=new THREE.Mesh(g,m); f.castShadow=true; return f; }
const palms=[];
function palm(x,z,h,lean,rot){ const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
  const n=9; let px=0,py=0; for(let i=0;i<n;i++){ const t=i/n; const seg=cyl(.17-t*.06,.2-t*.06,h/n+.02,i%2?trunkM:trunkRing,px,py+h/n/2,0,g,10); seg.rotation.z=-lean*t*1.4; px+=Math.sin(lean*t*1.4)*h/n; py+=Math.cos(lean*t*1.4)*h/n; }
  const crown=new THREE.Group(); crown.position.set(px,py,0); g.add(crown);
  for(let i=0;i<9;i++){ const f=frond(2.2+Math.random()*.6,i%2?leafM:leafM2); f.rotation.order='YXZ'; f.rotation.y=i/9*Math.PI*2; f.rotation.x=-1.05-Math.random()*.25; crown.add(f); }
  for(let i=0;i<3;i++){ const c=new THREE.Mesh(new THREE.SphereGeometry(.11,10,8),mat(0x4a3018)); c.position.set(Math.cos(i*2.1)*.15,-.12,Math.sin(i*2.1)*.15); crown.add(c); }
  palms.push(crown); return g; }
// jungle ring (sides + front), leaving the ocean view open behind the desk
[[-6.8,-3.2,5.2,.25,.4],[-7.4,-.4,4.6,.3,1.2],[-6.6,2.6,5.6,.22,2.1],[-4.6,5.2,4.8,.28,2.6],[7.6,-2.0,5.4,.25,2.6],[7.2,.6,4.4,.3,3.4],[6.2,3.6,5.8,.2,4.2],
[4.4,-4.6,4.9,.22,-.4]].forEach(a=>palm(...a));
palm(1.6,-4.5,4.6,.08,.2); palm(5.4,-4.0,4.6,.08,-.3); // the two palms holding the views sign
// jungle bushes
const bushM=[mat(0x2a7a3a),mat(0x1f6b30),mat(0x3d9a48)];
function bush(x,z,s){ const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  for(let i=0;i<5;i++){ const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.5*s*(.7+Math.random()*.5),0),bushM[i%3]); b.position.set((Math.random()-.5)*s,.3*s+Math.random()*.2*s,(Math.random()-.5)*s); b.castShadow=true; g.add(b); }
  for(let i=0;i<6;i++){ const f=frond(1.1*s,i%2?leafM:leafM2); f.rotation.order='YXZ'; f.rotation.y=Math.random()*Math.PI*2; f.rotation.x=-.5-Math.random()*.6; f.scale.set(1.6,1,1); g.add(f); } }
[[-7.6,-2],[-7.8,1.4],[-6.2,4.4],[-2.8,6.4],[1,6.6],[5,5.2],[7.6,2.2],[7.8,-1],[-5.6,-4.6],[6.4,-4.2],[-3.6,6.0],[7.2,4.2]].forEach(([x,z])=>bush(x,z,1+Math.random()*.6));
// flowers
[[-6.4,1.6,0xff3d6e],[-5.2,4.6,0xffd400],[6.6,1.4,0xff7a1a],[4.4,5.0,0xff3d6e],[-7,-1.2,0xffffff]].forEach(([x,z,c])=>{ for(let i=0;i<4;i++){ const f=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),mat(c,{emissive:c,emissiveIntensity:.25})); f.position.set(x+(Math.random()-.5)*.6,.55+Math.random()*.3,z+(Math.random()-.5)*.6); scene.add(f);} });

// ---------- views counter: driftwood sign hung between two palms ----------
const ledTex=canvasTex(1024,200,()=>{});
function drawCounter(n){ const {x}=ledTex.userData; x.fillStyle='#0b0505'; x.fillRect(0,0,1024,200); x.font='bold 150px "Courier New",monospace'; x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='#2a0808'; x.fillText('8,888,888',512,108); x.shadowColor='#ff2a2a'; x.shadowBlur=24; x.fillStyle='#ff3b30'; x.fillText(fmt(n),512,108); x.shadowBlur=0; ledTex.needsUpdate=true; }
const sign=new THREE.Group(); sign.position.set(3.5,3.0,-4.25); sign.rotation.y=-.05; scene.add(sign);
box(4.0,1.25,.14,0x6b4a2c,0,0,0,sign,{roughness:1});
const led=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.72),new THREE.MeshBasicMaterial({map:ledTex})); led.position.set(0,.12,.08); sign.add(led);
const lblTex=canvasTex(512,64,(x)=>{ x.fillStyle='#ffd400'; x.font='bold 40px Inter,sans-serif'; x.textAlign='center'; x.fillText('VISTAS EN YOUTUBE',256,46); });
const lbl=new THREE.Mesh(new THREE.PlaneGeometry(1.9,.24),new THREE.MeshBasicMaterial({map:lblTex,transparent:true})); lbl.position.set(0,-.42,.08); sign.add(lbl);
[-1.85,1.85].forEach(x=>{ const r=box(.03,1.3,.03,0xc9a777,x,1.25,0,sign); r.rotation.z=x>0?-.35:.35; });
const ledGlow=new THREE.PointLight(0xff3b30,.9,5); ledGlow.position.set(3.5,2.9,-3.6); scene.add(ledGlow);

// ---------- desk on the sand ----------
const desk=new THREE.Group(); desk.position.set(-1.6,0,-2.2); scene.add(desk);
const plankM=mat(0x8a5a33,{roughness:.9});
box(3.2,.1,1.1,plankM,0,.95,0,desk);
for(let i=0;i<4;i++) box(3.2,.012,.01,0x5a3a20,0,1.0,-.41+i*.27,desk);
[[-1.5,-.45],[1.5,-.45],[-1.5,.45],[1.5,.45]].forEach(([x,z])=>cyl(.05,.05,.95,0xc9a777,x,.475,z,desk,8)); // bamboo legs
const scrTex=canvasTex(512,288,()=>{});
function drawScreen(t){ const {x}=scrTex.userData; x.fillStyle='#0e1320'; x.fillRect(0,0,512,288); const cols=['#1fbf5b','#ffd400','#e0302f','#4aa3ff'];
  for(let tr=0;tr<4;tr++){ x.fillStyle='#ffffff10'; x.fillRect(0,20+tr*66,512,58); x.fillStyle=cols[tr];
    for(let k=0;k<512;k+=4){ const a=(Math.sin(k*.05+tr+t*2)*.5+.5)*(Math.sin(k*.013+tr*3)*.5+.5)*24+2; x.fillRect(k,49+tr*66-a,3,a*2);} }
  const ph=(t*60)%512; x.fillStyle='#fff'; x.fillRect(ph,0,2,288); scrTex.needsUpdate=true; }
[-.55,.55].forEach((x,i)=>{ const g=new THREE.Group(); g.position.set(x,1.43,-.25); g.rotation.y=i?-.18:.18; desk.add(g);
  box(1.02,.6,.05,0x0a0a0a,0,0,0,g); const s=new THREE.Mesh(new THREE.PlaneGeometry(.96,.54),new THREE.MeshBasicMaterial({map:scrTex})); s.position.z=.03; g.add(s); box(.06,.38,.06,0x222,0,-.3,-.04,g); });
[-1.35,1.35].forEach(x=>{ const g=new THREE.Group(); g.position.set(x,1.25,-.2); desk.add(g); box(.32,.5,.32,0x111,0,0,0,g);
  cyl(.11,.11,.03,0x333,0,-.07,.165,g).rotation.x=Math.PI/2; cyl(.045,.045,.03,0x555,0,.14,.165,g).rotation.x=Math.PI/2; });
const kb=new THREE.Group(); kb.position.set(0,1.02,.22); desk.add(kb); box(1.5,.05,.32,0x161616,0,0,0,kb);
for(let i=0;i<24;i++) box(.055,.02,.2,0xf2f2f2,-.66+i*.0575,.035,.04,kb);
for(let i=0;i<24;i++) if([1,3,6,8,10].includes(i%12)) box(.035,.03,.12,0x0a0a0a,-.635+i*.0575,.05,-.01,kb);
box(.4,.08,.22,0xb0151b,-1.1,1.05,.28,desk); [-.12,0,.12].forEach(x=>cyl(.025,.025,.03,0x111,-1.1+x,1.1,.28,desk));
const mic=new THREE.Group(); mic.position.set(1.0,1.0,.1); desk.add(mic);
cyl(.03,.03,.7,0x222,0,.35,-.35,mic); const arm=box(.04,.04,.8,0x222,0,.72,0,mic); arm.rotation.x=-.5;
cyl(.07,.07,.22,0x9a9a9a,0,.86,.36,mic); cyl(.075,.075,.08,0x333,0,.99,.36,mic);
cyl(.09,.11,.16,0x6b4423,1.35,1.08,.35,desk,12); const straw=cyl(.01,.01,.25,0xff3d6e,1.38,1.25,.35,desk,6); straw.rotation.z=-.3; // coconut drink
const chair=new THREE.Group(); chair.position.set(-1.6,0,-1.05); chair.rotation.y=Math.PI; scene.add(chair);
box(.6,.1,.6,0x111,0,.55,0,chair); box(.6,.75,.08,0x111,0,1.0,-.28,chair); cyl(.04,.04,.45,0x333,0,.3,0,chair); box(.6,.04,.08,0x333,0,.06,0,chair); box(.08,.04,.6,0x333,0,.06,0,chair);
// tiki torches
const flames=[];
[[-3.6,-1.0],[0.9,-1.2],[-4.4,1.6],[4.6,-1.8]].forEach(([x,z])=>{ cyl(.04,.05,1.7,0x7a5634,x,.85,z,scene,8); cyl(.11,.08,.22,0x5e3f24,x,1.75,z,scene,8);
  const f=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,10),new THREE.MeshBasicMaterial({color:0xffa23a})); f.position.set(x,2.0,z); scene.add(f);
  const l=new THREE.PointLight(0xff8a2a,.9,4.5); l.position.set(x,2.1,z); scene.add(l); flames.push([f,l]); });

// ---------- instruments ----------
function flyingV(){ const g=new THREE.Group();
  const s=new THREE.Shape(); s.moveTo(0,.2); s.lineTo(-.36,-.5); s.lineTo(-.24,-.56); s.lineTo(0,-.12); s.lineTo(.24,-.56); s.lineTo(.36,-.5); s.lineTo(0,.2);
  const body=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.045,bevelEnabled:true,bevelSize:.01,bevelThickness:.01,bevelSegments:2}),mat(0xc8102e,{roughness:.25,metalness:.1})); body.castShadow=true; g.add(body);
  const pg=new THREE.Shape(); pg.moveTo(0,.12); pg.lineTo(-.2,-.24); pg.lineTo(0,-.05); pg.lineTo(.2,-.24); pg.lineTo(0,.12);
  const guard=new THREE.Mesh(new THREE.ShapeGeometry(pg),mat(0xffffff)); guard.position.z=.058; g.add(guard);

[[frog(),1.25,-.25,0],[frog({body:0x1f6fff,side:0x0a2a8a,eye:0x111111,foot:0x0b3ea8,belly:0x9fc4ff,spots:0x050a20}),-1.3,.3,2.1]].forEach(([f,x,rot,ph])=>{
  f.scale.setScalar(.5); f.position.set(x,.63,0); f.rotation.y=rot; f.userData.baseRot=rot; sign.add(f);
  updaters.push(idleFrog(f,ph)); updaters.push(makeHopper(f,.63)); });

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffd2b0,0x5a3a7a,.75));
const sunL=new THREE.DirectionalLight(0xffb070,1.3); sunL.position.set(-8,10,-14); sunL.castShadow=true; sunL.shadow.mapSize.set(2048,2048);
Object.assign(sunL.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:50}); scene.add(sunL);
const fill=new THREE.DirectionalLight(0xc79bff,.45); fill.position.set(6,6,10); scene.add(fill);

// ---------- camera orbit ----------
let yaw=.25, pitch=.4, dist=13, tYaw=yaw, tPitch=pitch, tDist=dist; const target=new THREE.Vector3(0,1.3,-.6);
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,moved:0}; });
addEventListener('pointermove',e=>{ hover(e); if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved+=Math.abs(dx)+Math.abs(dy); drag.x=e.clientX; drag.y=e.clientY;
  tYaw=Math.max(-1.3,Math.min(1.3,tYaw-dx*.005)); tPitch=Math.max(.08,Math.min(1.15,tPitch+dy*.004)); });
addEventListener('pointerup',e=>{ if(drag && drag.moved<6) pick(e); drag=null; });
addEventListener('wheel',e=>{ tDist=Math.max(5,Math.min(18,tDist+e.deltaY*.006)); },{passive:true});

// ---------- picking ----------
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function hit(e){ if(e.target!==renderer.domElement) return null; mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(clickables,true); return h.length?h[0].object:null; }
function pick(e){ const o=hit(e); if(o&&o.userData.onClick) o.userData.onClick(); }
let hovT=0; function hover(e){ const n=performance.now(); if(n-hovT<60) return; hovT=n; document.body.classList.toggle('hover',!!hit(e)); }

// ---------- panels: card, music player, video ----------
const card=document.getElementById('card'), player=document.getElementById('player'), video=document.getElementById('video');
let wave=0;
function openCard(){ card.classList.add('on'); wave=1.6; }
card.querySelector('.x').onclick=()=>card.classList.remove('on');
const slot=document.getElementById('player-slot'), ptitle=document.getElementById('player-t');
function closePlayer(){ player.classList.remove('on'); slot.innerHTML=''; }
player.querySelector('.x').onclick=closePlayer;
let spApi=null;
window.onSpotifyIframeApiReady=api=>{ spApi=api; };
function playSpotify(){ closeVideo(); ptitle.textContent='SPOTIFY \u00B7 KONNICHIWA'; slot.innerHTML='<div id="sp-embed"></div>'; player.classList.add('on');
  if(spApi){ spApi.createController(document.getElementById('sp-embed'),{uri:'spotify:track:'+MUSIC.spotifyTrack,width:'100%',height:152},c=>{ c.addListener('ready',()=>c.play()); }); }
  else slot.innerHTML='<iframe src="https://open.spotify.com/embed/track/'+MUSIC.spotifyTrack+'" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>'; }
function playApple(){ closeVideo(); ptitle.textContent='APPLE MUSIC \u00B7 PANAM\u00C1'; player.classList.add('on');
  slot.innerHTML='<iframe src="'+MUSIC.appleEmbed+'" height="175" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>'; }
const vslot=document.getElementById('video-slot');
function playVideo(){ closePlayer(); video.classList.add('on'); vslot.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+MUSIC.youtubeId+'?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'; }
function closeVideo(){ video.classList.remove('on'); vslot.innerHTML=''; }
video.querySelector('.x').onclick=closeVideo;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeVideo(); closePlayer(); card.classList.remove('on'); } });

// ---------- stats ----------
let shown=0, goal=FALLBACK.views;
function apply(s){ goal=s.views; document.getElementById('c-subs').textContent=fmt(s.subs); document.getElementById('c-views').textContent=fmt(s.views); document.getElementById('c-videos').textContent=fmt(s.videos); }
apply(FALLBACK);
const load=()=>fetch('stats.json?t='+Date.now()).then(r=>r.json()).then(apply).catch(()=>{});
load(); setInterval(load,60000);

// ---------- loop ----------
const clock=new THREE.Clock(); let last=0;
function frame(){ const t=clock.getElapsedTime(), dt=Math.min(.05,t-last); last=t;
  yaw+=(tYaw-yaw)*.08; pitch+=(tPitch-pitch)*.08; dist+=(tDist-dist)*.08;
  camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist,target.z+Math.cos(yaw)*Math.cos(pitch)*dist); camera.lookAt(target);
  shown+=(goal-shown)*.04; if(Math.abs(goal-shown)<1) shown=goal; drawCounter(shown);
  drawScreen(t); drawTV(t);
  const a=oceanGeo.attributes.position; for(let i=0;i<a.count;i++){ const x=oceanBase[i*3], y=oceanBase[i*3+1]; a.setZ(i,Math.sin(x*.35+t*1.2)*.08+Math.cos(y*.3+t*.9)*.08); } a.needsUpdate=true; oceanGeo.computeVertexNormals();
  foam.material.opacity=.5+Math.sin(t*1.5)*.25; foam.scale.set(8.95+Math.sin(t*1.5)*.12,7.5+Math.sin(t*1.5)*.1,1);
  palms.forEach((c,i)=>{ c.rotation.z=Math.sin(t*.9+i)*.05; c.rotation.x=Math.cos(t*.7+i)*.04; });
  flames.forEach(([f,l],i)=>{ f.scale.set(1,1+Math.sin(t*18+i*3)*.12+Math.random()*.08,1); l.intensity=.75+Math.random()*.3; });
  const beat=t*152/60*Math.PI*2; // Luis vibes at 152 BPM
  head.rotation.x=Math.sin(beat)*.08; luis.rotation.y=Math.sin(t*.8)*.25; luis.position.y=Math.abs(Math.sin(beat/2))*.03;
  if(wave>0){ wave-=dt; armR.rotation.z=2.6+Math.sin(t*12)*.35; } else armR.rotation.z=Math.sin(beat/2)*.12;
  armL.rotation.z=-Math.sin(beat/2)*.12;
  ampL.material.emissiveIntensity=1.5+Math.sin(beat);
  // crocodile walks a loop in front of the studio
  const ct=t*.12, cx=.6+Math.cos(ct)*3.4, cz=2.2+Math.sin(ct)*1.4;
  croc.position.set(cx,0,cz); croc.rotation.y=Math.atan2(-Math.sin(ct)*3.4,Math.cos(ct)*1.4);
  const stride=Math.sin(t*6); legs.forEach((l,i)=>{ l.rotation.x=(i===0||i===3?stride:-stride)*.5; });
  tail.forEach((s,i)=>{ s.rotation.y=Math.sin(t*3-i*.7)*.25; }); cBody.rotation.y=Math.sin(t*3)*.06;
  if(snap>0){ snap-=dt; jaw.rotation.x=Math.abs(Math.sin(snap*14))*.6; } else jaw.rotation.x=(Math.sin(t*.8)>.96)?.35:0;
  updaters.forEach(u=>u(t,dt));
  renderer.render(scene,camera); requestAnimationFrame(frame); }
frame();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
})();
</script>
</body>
</html>
