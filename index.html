<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luis Sandoval &#xB7; Live Views</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07080c;--ink:#f4f1ea;--dim:#9aa0ad;--gold:#ffd400;--green:#1fbf5b;--red:#e0302f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;transition:opacity .6s}
  #loader .pct{font:64px "Archivo Black",sans-serif;text-align:center}
  #loader .bar{width:120px;height:3px;background:#222;margin:10px auto}
  #loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold),var(--red))}
  #loader .msg{font-size:11px;letter-spacing:.25em;color:var(--dim);text-align:center;text-transform:uppercase}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:13px;color:var(--dim);background:#0009;padding:8px 14px;border-radius:999px;pointer-events:none}
  #card{position:fixed;top:20px;left:20px;width:300px;background:#0d0f16ee;border:1px solid #2a2e3a;border-radius:14px;padding:18px 18px 16px;backdrop-filter:blur(6px);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.25s}
  #card.on{opacity:1;transform:none;pointer-events:auto}
  #card .tag{font-size:10px;letter-spacing:.25em;color:var(--green);font-weight:700}
  #card h1{font:28px "Archivo Black",sans-serif;margin:6px 0 12px}
  #card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  #card dt{color:var(--dim)} #card dd{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  #card .x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer}
  #card a{display:block;margin-top:14px;text-align:center;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:9px;border-radius:8px}
</style>
</head>
<body>
<div id="loader"><div><div class="pct" id="pct">0%</div><div class="bar"><i id="bar"></i></div><div class="msg" id="msg">Afinando la guitarra</div></div></div>
<div id="hint">Arrastra para mirar &#xB7; rueda para acercar &#xB7; toca a Luis</div>
<div id="card">
  <button class="x" aria-label="Cerrar">&#xD7;</button>
  <div class="tag">ARTISTA IDENTIFICADO</div>
  <h1>LUIS SANDOVAL</h1>
  <dl>
    <dt>G&#xE9;nero</dt><dd>Corridos Tropicales</dd>
    <dt>Suscriptores</dt><dd id="c-subs">&#x2014;</dd>
    <dt>Vistas totales</dt><dd id="c-views">&#x2014;</dd>
    <dt>Videos</dt><dd id="c-videos">&#x2014;</dd>
    <dt>Status</dt><dd>En el estudio &#x1F3A7;</dd>
  </dl>
  <a href="https://www.youtube.com/@Luissandovallll" target="_blank" rel="noopener">Ver canal en YouTube</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
const FALLBACK = { subs: 20400, views: 8609485, videos: 297 };
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- loader ----------
const msgs = ['Afinando la guitarra','Conectando el micro','Prendiendo las luces','Subiendo el volumen'];
let p = 0; const pct = document.getElementById('pct'), bar = document.getElementById('bar'), msg = document.getElementById('msg');
const loadTick = setInterval(() => { p = Math.min(100, p + 4 + Math.random()*9); pct.textContent = Math.floor(p)+'%'; bar.style.width = p+'%'; msg.textContent = msgs[Math.min(3, Math.floor(p/26))];
  if (p >= 100) { clearInterval(loadTick); setTimeout(()=>{ const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),600); }, 250); } }, 70);

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07080c);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);

const mat = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8 }, o));
function box(w,h,d,c,x,y,z,parent=scene,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), c.isMaterial?c:mat(c,o)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m; }
function cyl(r1,r2,h,c,x,y,z,parent=scene,seg=20){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), c.isMaterial?c:mat(c)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; parent.add(m); return m; }

// room: 10 wide (x), 8 deep (z), 4.2 tall
const W=10, D=8, H=4.2;
// wood floor via canvas
const fc=document.createElement('canvas'); fc.width=fc.height=512; const fx=fc.getContext('2d');
for(let r=0;r<16;r++) for(let c=0;c<4;c++){ const off=(r%2)*64; const l=40+Math.random()*18; fx.fillStyle=`hsl(28,38%,${l}%)`; fx.fillRect(c*128+off-128,r*32,128,32); fx.strokeStyle='#0003'; fx.strokeRect(c*128+off-128,r*32,128,32); fx.fillRect(c*128+off,r*32,128,32); fx.strokeRect(c*128+off,r*32,128,32);}
const ftex=new THREE.CanvasTexture(fc); ftex.wrapS=ftex.wrapT=THREE.RepeatWrapping; ftex.repeat.set(3,2.4); ftex.encoding=THREE.sRGBEncoding;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D), mat(0xffffff,{map:ftex,roughness:.7})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const wallM = mat(0x23202e);
box(W,H,.15,wallM,0,H/2,-D/2);            // back wall
box(.15,H,D,wallM,-W/2,H/2,0);            // left wall
box(.15,H,D,wallM, W/2,H/2,0);            // right wall
box(W,.12,.06,0x1fbf5b,0,.06,-D/2+.1, scene,{emissive:0x1fbf5b,emissiveIntensity:1.5}); // LED strip floor line
// rug
const rug=box(4.2,.02,3,0x6b1414,0,.01,.6); const rug2=box(3.8,.025,2.6,0x8a1d1d,0,.012,.6);

// acoustic foam panels (checker) on back + left wall
const foamA=mat(0x14161d,{roughness:1}), foamB=mat(0x1a1d26,{roughness:1});
for(let i=0;i<6;i++) for(let j=0;j<3;j++) box(.45,.45,.08,(i+j)%2?foamA:foamB,-4.2+i*.5,1.4+j*.5,-D/2+.12);
for(let i=0;i<5;i++) for(let j=0;j<3;j++) box(.08,.45,.45,(i+j)%2?foamA:foamB,-W/2+.12,1.4+j*.5,-2.6+i*.5);

// ---------- LED views counter ----------
const lc=document.createElement('canvas'); lc.width=1024; lc.height=200; const lx=lc.getContext('2d');
const ltex=new THREE.CanvasTexture(lc); ltex.encoding=THREE.sRGBEncoding;
function drawCounter(n){ lx.fillStyle='#0b0505'; lx.fillRect(0,0,1024,200); lx.font='bold 150px "Courier New",monospace'; lx.textAlign='center'; lx.textBaseline='middle';
  lx.fillStyle='#2a0808'; lx.fillText('8,888,888',512,108); lx.shadowColor='#ff2a2a'; lx.shadowBlur=24; lx.fillStyle='#ff3b30'; lx.fillText(fmt(n),512,108); lx.shadowBlur=0; ltex.needsUpdate=true; }
const counter=new THREE.Mesh(new THREE.BoxGeometry(4.4,.86,.12),[mat(0x111),mat(0x111),mat(0x111),mat(0x111),new THREE.MeshBasicMaterial({map:ltex}),mat(0x111)]);
counter.position.set(1.4,3.25,-D/2+.15); scene.add(counter);
const lbl=document.createElement('canvas'); lbl.width=512; lbl.height=64; const lb=lbl.getContext('2d'); lb.fillStyle='#ffd400'; lb.font='bold 40px Inter,sans-serif'; lb.textAlign='center'; lb.fillText('VISTAS EN YOUTUBE',256,46);
const lblM=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.28),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(lbl),transparent:true})); lblM.position.set(1.4,2.68,-D/2+.16); scene.add(lblM);

// neon "LS" sign on left wall
const ns=document.createElement('canvas'); ns.width=512; ns.height=256; const nx=ns.getContext('2d');
nx.font='italic bold 190px Georgia,serif'; nx.textAlign='center'; nx.textBaseline='middle'; nx.shadowBlur=30; nx.shadowColor='#ffd400'; nx.strokeStyle='#ffe766'; nx.lineWidth=7; nx.strokeText('Ls',256,135); nx.fillStyle='#fff6b0'; nx.fillText('Ls',256,135);
const neon=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(ns),transparent:true})); neon.rotation.y=Math.PI/2; neon.position.set(-W/2+.1,3.3,1.6); scene.add(neon);
const neonLight=new THREE.PointLight(0xffd400,1.2,4); neonLight.position.set(-W/2+.6,3.2,1.6); scene.add(neonLight);

// ---------- studio desk ----------
const desk=new THREE.Group(); desk.position.set(-2.2,0,-D/2+1.1); scene.add(desk);
box(3.2,.08,1.1,0x2a1b12,0,.95,0,desk);
[[-1.5,-.45],[1.5,-.45],[-1.5,.45],[1.5,.45]].forEach(([x,z])=>box(.07,.95,.07,0x111,x,.475,z,desk));
// monitors (screens show a DAW-ish waveform)
const sc=document.createElement('canvas'); sc.width=512; sc.height=288; const sx=sc.getContext('2d');
const stex=new THREE.CanvasTexture(sc); stex.encoding=THREE.sRGBEncoding;
function drawScreen(t){ sx.fillStyle='#0e1320'; sx.fillRect(0,0,512,288); const cols=['#1fbf5b','#ffd400','#e0302f','#4aa3ff'];
  for(let tr=0;tr<4;tr++){ sx.fillStyle='#ffffff10'; sx.fillRect(0,20+tr*66,512,58); sx.fillStyle=cols[tr];
    for(let x=0;x<512;x+=4){ const a=(Math.sin(x*.05+tr+t*2)*.5+.5)*(Math.sin(x*.013+tr*3)*.5+.5)*24+2; sx.fillRect(x,49+tr*66-a,3,a*2);} }
  const ph=(t*60)%512; sx.fillStyle='#fff'; sx.fillRect(ph,0,2,288); stex.needsUpdate=true; }
[-.55,.55].forEach((x,i)=>{ const g=new THREE.Group(); g.position.set(x,1.42,-.25); g.rotation.y=i?-.18:.18; desk.add(g);
  box(1.02,.6,.05,0x0a0a0a,0,0,0,g); const s=new THREE.Mesh(new THREE.PlaneGeometry(.96,.54),new THREE.MeshBasicMaterial({map:stex})); s.position.z=.03; g.add(s);
  box(.06,.38,.06,0x222,0,-.3,-.04,g); });
// studio speakers
[-1.35,1.35].forEach(x=>{ const g=new THREE.Group(); g.position.set(x,1.22,-.2); desk.add(g); box(.32,.5,.32,0x111,0,0,0,g);
  cyl(.11,.11,.03,0x333,0,-.07,.165,g).rotation.x=Math.PI/2; cyl(.045,.045,.03,0x555,0,.14,.165,g).rotation.x=Math.PI/2; });
// MIDI keyboard
const kb=new THREE.Group(); kb.position.set(0,1.0,.22); desk.add(kb); box(1.5,.05,.32,0x161616,0,0,0,kb);
for(let i=0;i<24;i++) box(.055,.02,.2,0xf2f2f2,-.66+i*.0575,.035,.04,kb);
for(let i=0;i<24;i++) if([1,3,6,8,10].includes(i%12)) box(.035,.03,.12,0x0a0a0a,-.635+i*.0575,.05,-.01,kb);
// audio interface w/ glowing knobs
box(.4,.08,.22,0xb0151b,-1.1,1.03,.28,desk); [-.12,0,.12].forEach(x=>cyl(.025,.025,.03,0x111,-1.1+x,1.08,.28,desk));
// mic on boom arm
const mic=new THREE.Group(); mic.position.set(1.0,1.0,.1); desk.add(mic);
cyl(.03,.03,.7,0x222,0,.35,-.35,mic); const arm=box(.04,.04,.8,0x222,0,.72,0,mic); arm.rotation.x=-.5;
const micBody=cyl(.07,.07,.22,0x9a9a9a,0,.86,.36,mic); cyl(.075,.075,.08,0x333,0,.99,.36,mic);
// chair
const chair=new THREE.Group(); chair.position.set(-2.2,0,-D/2+2.15); chair.rotation.y=Math.PI; scene.add(chair);
box(.6,.1,.6,0x111,0,.55,0,chair); box(.6,.75,.08,0x111,0,1.0,-.28,chair); cyl(.04,.04,.45,0x333,0,.3,0,chair); box(.6,.04,.08,0x333,0,.06,0,chair); box(.08,.04,.6,0x333,0,.06,0,chair);

// ---------- Flying V guitar on stand ----------
function flyingV(){
  const g=new THREE.Group();
  const s=new THREE.Shape(); // V body pointing down; neck attaches at the notch
  s.moveTo(0,.2); s.lineTo(-.36,-.5); s.lineTo(-.24,-.56); s.lineTo(0,-.12); s.lineTo(.24,-.56); s.lineTo(.36,-.5); s.lineTo(0,.2);
  const body=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.045,bevelEnabled:true,bevelSize:.01,bevelThickness:.01,bevelSegments:2}), mat(0xc8102e,{roughness:.25,metalness:.1}));
  body.castShadow=true; g.add(body);
  const pg=new THREE.Shape(); pg.moveTo(0,.12); pg.lineTo(-.2,-.24); pg.lineTo(0,-.05); pg.lineTo(.2,-.24); pg.lineTo(0,.12);
  const guard=new THREE.Mesh(new THREE.ShapeGeometry(pg),mat(0xffffff)); guard.position.z=.058; g.add(guard);
  box(.06,.75,.03,0x3b2414,0,.55,.04,g);                       // neck
  const head=box(.1,.18,.03,0xc8102e,0,1.0,.04,g,{roughness:.25}); head.rotation.z=.0;
  for(let i=0;i<3;i++){ box(.03,.015,.02,0xdddddd,-.065,.94+i*.05,.04,g); box(.03,.015,.02,0xdddddd,.065,.94+i*.05,.04,g);}
  for(let i=0;i<6;i++) box(.003,1.1,.003,0xeeeeee,-.0125+i*.005,.38,.065,g); // strings
  box(.14,.03,.02,0x111,0,.02,.06,g); box(.14,.03,.02,0x111,0,-.09,.06,g); // pickups
  return g;
}
const gstand=new THREE.Group(); gstand.position.set(-.15,0,-D/2+.9); gstand.rotation.y=-.35; scene.add(gstand);
const vg=flyingV(); vg.position.set(0,.68,0); vg.rotation.x=-.18; gstand.add(vg);
[-.15,.15].forEach(x=>{ const l=box(.025,.5,.025,0x111,x,.25,.06,gstand); l.rotation.z=x>0?-.3:.3; }); box(.025,.9,.025,0x111,0,.45,-.12,gstand);
// amp next to it
const amp=new THREE.Group(); amp.position.set(.75,0,-D/2+.55); scene.add(amp);
box(.7,.6,.35,0x161616,0,.3,0,amp); box(.6,.38,.01,0x3a3226,0,.25,.18,amp); box(.7,.1,.36,0x0d0d0d,0,.56,0,amp);
const ampL=box(.03,.03,.01,0xff3b30,.28,.56,.185,amp,{emissive:0xff3b30,emissiveIntensity:2});

// couch on right
const couch=new THREE.Group(); couch.position.set(3.4,0,-1.2); couch.rotation.y=-Math.PI/2; scene.add(couch);
box(2.4,.4,.9,0x1d3a2a,0,.3,0,couch); box(2.4,.6,.2,0x1d3a2a,0,.75,-.38,couch); box(.2,.55,.9,0x1d3a2a,-1.15,.5,0,couch); box(.2,.55,.9,0x1d3a2a,1.15,.5,0,couch);
box(.45,.4,.12,0xffd400,-.6,.7,-.18,couch).rotation.x=-.2; box(.45,.4,.12,0xe0302f,.6,.7,-.18,couch).rotation.x=-.2;
// plant
const plant=new THREE.Group(); plant.position.set(4.3,0,-3.4); scene.add(plant); cyl(.22,.16,.45,0x8a5a3b,0,.22,0,plant);
for(let i=0;i<9;i++){ const lf=box(.07,.9,.22,0x2f8f3f,0,.85,0,plant); lf.rotation.set(Math.cos(i)*.5,i*.7,Math.sin(i)*.5); }
// platinum record frames on back wall
[[-0.9,2.25],[3.9,2.25]].forEach(([x,y],i)=>{ box(.62,.62,.04,0x0a0a0a,x,y,-D/2+.1); const r=cyl(.24,.24,.01,i?0xffd400:0xd8d8d8,x,y,-D/2+.13); r.rotation.x=Math.PI/2; r.material.metalness=.9; r.material.roughness=.25; });

// ---------- Luis (blocky avatar) ----------
const luis=new THREE.Group(); luis.position.set(.6,0,.8); scene.add(luis);
const skin=mat(0xc99772), black=mat(0x111111);
box(.18,.75,.2,black,-.11,.375,0,luis); box(.18,.75,.2,black,.11,.375,0,luis);           // legs
box(.2,.08,.28,0xffffff,-.11,.04,.04,luis); box(.2,.08,.28,0xffffff,.11,.04,.04,luis);  // sneakers
// track jacket: black with teal chevron
const torso=box(.5,.62,.28,0x101418,0,1.06,0,luis);
const chev=box(.48,.12,.01,0x2bb3c0,0,1.08,.145,luis); const chev2=box(.48,.05,.01,0x8a2a6a,0,.98,.145,luis);
// Mexico flag cape
const cape=new THREE.Group(); cape.position.set(0,1.34,-.16); luis.add(cape);
[[0x006847,-.2],[0xffffff,0],[0xce1126,.2]].forEach(([c,x])=>{ const m=box(.2,.95,.02,c,x,-.47,0,cape); });
const armL=new THREE.Group(); armL.position.set(-.31,1.33,0); luis.add(armL); box(.13,.58,.16,0x101418,0,-.28,0,armL); box(.12,.12,.14,skin,0,-.62,0,armL);
const armR=new THREE.Group(); armR.position.set(.31,1.33,0); luis.add(armR); box(.13,.58,.16,0x101418,0,-.28,0,armR); box(.12,.12,.14,skin,0,-.62,0,armR);
const head=new THREE.Group(); head.position.set(0,1.62,0); luis.add(head);
box(.4,.42,.38,skin,0,0,0,head);
box(.42,.14,.4,0x0b0b0b,0,.22,-.01,head); box(.36,.1,.12,0x0b0b0b,0,.2,.16,head); // messy hair
[-.1,.1].forEach(x=>{ box(.06,.06,.01,0x111,x,.03,.195,head); });
const smile=box(.14,.03,.01,0x5a2a1a,0,-.1,.195,head);
const chain=new THREE.Mesh(new THREE.TorusGeometry(.13,.012,8,24,Math.PI),mat(0xffd400,{metalness:.9,roughness:.2})); chain.rotation.z=Math.PI; chain.position.set(0,1.3,.15); luis.add(chain);
box(.07,.07,.01,0xffd400,0,1.16,.15,luis,{metalness:.9,roughness:.2});
// headphones
const hp=new THREE.Mesh(new THREE.TorusGeometry(.23,.025,8,24,Math.PI),black); hp.position.y=.05; head.add(hp);
box(.06,.14,.12,0x111,-.23,.0,0,head); box(.06,.14,.12,0x111,.23,.0,0,head);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x9aa4ff,0x2a1a10,.45));
const key=new THREE.SpotLight(0xffe2b8,1.3,20,.7,.5); key.position.set(2,4,4); key.target.position.set(0,1,-1); key.castShadow=true; key.shadow.mapSize.set(2048,2048); scene.add(key,key.target);
const green=new THREE.PointLight(0x1fbf5b,1.1,7); green.position.set(-3.8,.5,-3.2); scene.add(green);
const red=new THREE.PointLight(0xe0302f,1.0,7); red.position.set(4,.6,-3.6); scene.add(red);
const monGlow=new THREE.PointLight(0x7fb0ff,.7,3); monGlow.position.set(-2.2,1.5,-2.6); scene.add(monGlow);
const ctrGlow=new THREE.PointLight(0xff3b30,.8,4); ctrGlow.position.set(1.4,3.0,-3.3); scene.add(ctrGlow);

// ---------- camera orbit ----------
let yaw=.35, pitch=.42, dist=9.5, tYaw=yaw, tPitch=pitch, tDist=dist; const target=new THREE.Vector3(0,1.3,-1);
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,moved:0}; });
addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved+=Math.abs(dx)+Math.abs(dy); drag.x=e.clientX; drag.y=e.clientY;
  tYaw=Math.max(-1.1,Math.min(1.1,tYaw-dx*.005)); tPitch=Math.max(.08,Math.min(1.1,tPitch+dy*.004)); });
addEventListener('pointerup',e=>{ if(drag && drag.moved<6) pick(e); drag=null; });
addEventListener('wheel',e=>{ tDist=Math.max(4,Math.min(13,tDist+e.deltaY*.005)); },{passive:true});

// ---------- click Luis ----------
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), card=document.getElementById('card');
let wave=0;
function pick(e){ mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  if(ray.intersectObject(luis,true).length){ card.classList.add('on'); wave=1.6; } }
card.querySelector('.x').onclick=()=>card.classList.remove('on');

// ---------- stats ----------
let shown=0, goal=FALLBACK.views;
function apply(s){ goal=s.views; document.getElementById('c-subs').textContent=fmt(s.subs); document.getElementById('c-views').textContent=fmt(s.views); document.getElementById('c-videos').textContent=fmt(s.videos); }
apply(FALLBACK);
const load=()=>fetch('stats.json?t='+Date.now()).then(r=>r.json()).then(apply).catch(()=>{});
load(); setInterval(load, 60000);

// ---------- loop ----------
const clock=new THREE.Clock();
function frame(){ const t=clock.getElapsedTime(), dt=clock.getDelta();
  yaw+=(tYaw-yaw)*.08; pitch+=(tPitch-pitch)*.08; dist+=(tDist-dist)*.08;
  camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist, target.y+Math.sin(pitch)*dist, target.z+Math.cos(yaw)*Math.cos(pitch)*dist); camera.lookAt(target);
  shown += (goal-shown)*0.04; if(Math.abs(goal-shown)<1) shown=goal; drawCounter(shown);
  drawScreen(t);
  // Luis vibes: head nod on the beat (152 BPM), slight sway, wave when tapped
  const beat=t*152/60*Math.PI*2;
  head.rotation.x=Math.sin(beat)*.08; luis.rotation.y=Math.sin(t*.8)*.25; luis.position.y=Math.abs(Math.sin(beat/2))*.03;
  cape.rotation.x=.08+Math.sin(t*2.3)*.06;
  if(wave>0){ wave-=0.016; armR.rotation.z=2.6+Math.sin(t*12)*.35; } else { armR.rotation.z=Math.sin(beat/2)*.12; }
  armL.rotation.z=-Math.sin(beat/2)*.12;
  neonLight.intensity=1.1+Math.sin(t*20)*.05+(Math.random()<.01?-.6:0);
  ampL.material.emissiveIntensity=1.5+Math.sin(beat)*1;
  renderer.render(scene,camera); requestAnimationFrame(frame); }
frame();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
})();
</script>
