# Updates stats.json with live YouTube numbers every hour.
# Needs a repo secret named YT_API_KEY (YouTube Data API v3 key).
name: Update YouTube stats
on:
  schedule: [{ cron: "0 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch channel statistics
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          curl -sf "https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=@Luissandovallll&key=${YT_API_KEY}" -o raw.json
          jq '{subs: (.items[0].statistics.subscriberCount|tonumber),
               views: (.items[0].statistics.viewCount|tonumber),
               videos: (.items[0].statistics.videoCount|tonumber),
               updated: (now|todate)}' raw.json > stats.json
          rm raw.json
          cat stats.json
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update YouTube stats" && git push)
